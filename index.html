<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>College Attendance</title>
    <script>
      // Apply the last-used theme before first paint (avoids a light/dark flash).
      // Keep in sync with src/shared/theme/ThemeContext.jsx
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem("ca-theme:last"));
          if (!t) return;
          var mode = t.mode === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : t.mode;
          var root = document.documentElement;
          root.dataset.mode = mode;
          root.dataset.accent = t.accent;
          root.style.colorScheme = mode;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
